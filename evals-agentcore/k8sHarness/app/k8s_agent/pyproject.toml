[build-system]
requires = ["hatchling ~= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agent"
version = "0.1.0"
description = "k8s deep agent (nz-tech-rally) on AgentCore Runtime"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro ~= 0.21.0",
    "bedrock-agentcore >= 1.22.0",
    "deepagents == 0.7.35",
    "langchain ~= 1.5.0",
    "langchain-aws ~= 1.9.3",
    "langgraph ~= 1.2.20",
    "langchain-mcp-adapters ~= 0.3.2",
    "langgraph-checkpoint-aws ~= 1.2.7",
    "opentelemetry-instrumentation-langchain ~= 0.62.3",
    "slack-sdk >= 3.33.0",
    "pyyaml >= 6.0",
    "httpx >= 0.27.0",
    "python-dotenv >= 1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IRSA role for the k8s-agent ServiceAccount on any EKS cluster. Grants CloudWatch
  metrics/logs and X-Ray read access (agent + CloudWatch MCP sidecar) and Bedrock
  model invoke (for AGENT_MODEL=bedrock_converse:...). Deployed by infra/deploy.sh.

Parameters:
  OidcIssuerHost:
    Type: String
    Description: >
      The cluster's OIDC issuer without https://, e.g.
      oidc.eks.us-east-1.amazonaws.com/id/EXAMPLED539D4633E53DE1B71EXAMPLE
      (aws eks describe-cluster --name <cluster> --query cluster.identity.oidc.issuer).
      The IAM OIDC provider for it must exist (eksctl utils associate-iam-oidc-provider).
  AgentNamespace:
    Type: String
    Default: k8s-agent
  ServiceAccountName:
    Type: String
    Default: k8s-agent
  RoleName:
    Type: String
    Description: IAM role name (unique per account; deploy.sh uses k8s-agent-<cluster>).

Resources:
  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      # Built as a JSON string via Fn::Sub so the OIDC host can be used in IAM
      # Condition KEYS (intrinsics can't produce object keys).
      AssumeRolePolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": {"Federated": "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/${OidcIssuerHost}"},
            "Action": "sts:AssumeRoleWithWebIdentity",
            "Condition": {
              "StringEquals": {
                "${OidcIssuerHost}:sub": "system:serviceaccount:${AgentNamespace}:${ServiceAccountName}",
                "${OidcIssuerHost}:aud": "sts.amazonaws.com"
              }
            }
          }]
        }
      Policies:
        - PolicyName: k8s-agent-observability-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudWatchMetrics
                Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:DescribeAlarmsForMetric
                  - cloudwatch:DescribeAlarmHistory
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - cloudwatch:ListDashboards
                Resource: '*'
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:StartQuery
                  - logs:GetQueryResults
                  - logs:StopQuery
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource: '*'
              - Sid: XRayTraces
                Effect: Allow
                Action:
                  - xray:GetServiceGraph
                  - xray:GetTraceSummaries
                  - xray:GetTraceGraph
                  - xray:BatchGetTraces
                Resource: '*'
        - PolicyName: k8s-agent-bedrock-invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BedrockInvoke
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'

Outputs:
  RoleArn:
    Value: !GetAtt AgentRole.Arn

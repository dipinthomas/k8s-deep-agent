# K8s AI Agent — namespace, service account, RBAC, deployment
#
# This is a TEMPLATE. Don't kubectl apply it directly: run infra/deploy.sh, which
# replaces the double-underscore placeholders for your account, region and cluster:
#   ROLE_ARN (IRSA role from infra/cloudformation/agent-iam.yaml), AWS_REGION,
#   CLUSTER_NAME, AGENT_IMAGE, MCP_IMAGE (defaults: the published, tested tags),
#   AGENT_MODEL (provider:model, e.g. openai:gpt-5.4-mini).
# Requires the k8s-agent-secrets Secret (infra/agent-secrets.example.yaml) and the
# k8s-agent-cluster-skill ConfigMap (deploy.sh creates it from your SKILL.md).

---
apiVersion: v1
kind: Namespace
metadata:
  name: k8s-agent

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-agent
  namespace: k8s-agent
  annotations:
    # IRSA: grants the agent pod AWS credentials via the k8s-agent-irsa IAM role.
    # Role is created by infra/deploy.sh (infra/cloudformation/agent-iam.yaml).
    eks.amazonaws.com/role-arn: __ROLE_ARN__

---
# Namespace-scoped permissions in the agent's own namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-agent-role
  namespace: k8s-agent
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-agent-binding
  namespace: k8s-agent
subjects:
- kind: ServiceAccount
  name: k8s-agent
  namespace: k8s-agent
roleRef:
  kind: Role
  name: k8s-agent-role
  apiGroup: rbac.authorization.k8s.io

---
# Cluster-wide: full read/write access — agent investigates and remediates across all namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-agent-cluster-role
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["*"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-agent-cluster-binding
subjects:
- kind: ServiceAccount
  name: k8s-agent
  namespace: k8s-agent
roleRef:
  kind: ClusterRole
  name: k8s-agent-cluster-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-agent
  namespace: k8s-agent
  labels:
    app: k8s-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-agent
  template:
    metadata:
      labels:
        app: k8s-agent
      annotations:
        # Karpenter (EKS Auto) tries to consolidate underutilized nodes by
        # evicting pods. Mid-investigation, this kills the agent pod and
        # forces a Redis recovery. Block consolidation/disruption for the
        # agent — it must run uninterrupted while a Slack approval is
        # outstanding.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      serviceAccountName: k8s-agent
      containers:
      - name: agent
        image: __AGENT_IMAGE__
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: k8s-agent-secrets
        env:
        - name: AWS_REGION
          value: "__AWS_REGION__"
        - name: CLUSTER_NAME
          value: "__CLUSTER_NAME__"
        - name: AGENT_MODEL
          value: "__AGENT_MODEL__"
        - name: LOG_LEVEL
          value: "INFO"
        # Cluster skill: mounted from the k8s-agent-cluster-skill ConfigMap (see volumes).
        - name: CLUSTER_SKILL_PATH
          value: "./skills/clusters/__CLUSTER_NAME__/SKILL.md"
        # Cost / quality knobs (rollback of v35 over-aggressive defaults — Apr 2026):
        #   TOOL_OUTPUT_CHAR_LIMIT was 8000 by default in optimization.py and
        #   was truncating real kubectl output mid-list, hiding the pod the
        #   agent needed and pushing it into a CloudWatch fixation loop.
        #   Effectively disable truncation until we have a smarter strategy
        #   (e.g. truncate only on history replay, not first-read).
        - name: TOOL_OUTPUT_CHAR_LIMIT
          value: "999999999"
        #   Subagent run-cap was 6, which terminated subagents before they
        #   could finish a real investigation. 15 gives headroom without
        #   permitting unbounded loops.
        - name: SUBAGENT_MODEL_CALL_LIMIT
          value: "15"
        - name: STREAM_TIMEOUT_SEC
          value: "600"
        #   Output token cap restored to the pre-v35 default. 2048 was
        #   chopping legitimate enumerate-and-propose turns mid-tool-call.
        - name: ANTHROPIC_MAX_TOKENS
          value: "8192"
        # MCP sidecar URLs — sidecars run in the same pod so we use localhost.
        - name: KUBECTL_MCP_URL
          value: "http://localhost:3001/mcp"
        - name: CLOUDWATCH_MCP_URL
          value: "http://localhost:3002/mcp"
        # File-based memory: incidents.md is stored on an emptyDir volume mounted
        # at /agent-memory. Survives container restarts (kubelet keeps emptyDir
        # alive as long as the Pod exists). For cross-pod persistence, replace
        # emptyDir with a PVC.
        - name: AGENT_MEMORY_DIR
          value: "/agent-memory"
        # Redis is still used for the LangGraph checkpointer (HITL pause/resume).
        - name: REDIS_URL
          value: "redis://agent-redis.k8s-agent.svc.cluster.local:6379"
        # IRSA: EKS automatically injects these two vars into pods whose
        # ServiceAccount has the eks.amazonaws.com/role-arn annotation.
        # The AWS SDK (boto3) picks them up via the default credential chain.
        # AWS_ROLE_ARN            — injected by EKS
        # AWS_WEB_IDENTITY_TOKEN_FILE — injected by EKS
        volumeMounts:
        - name: agent-memory
          mountPath: /agent-memory
        - name: cluster-skill
          mountPath: /app/skills/clusters/__CLUSTER_NAME__
          readOnly: true
        ports:
        - containerPort: 8080
          name: http-trigger
        # Startup probe: wait up to ~150s for MCP sidecars + agent bootstrap before
        # liveness kicks in. Without this, the kubelet would kill the pod mid-boot.
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 30
          failureThreshold: 5
        resources:
          requests:
            memory: "2Gi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "500m"

      # ── MCP sidecars ──────────────────────────────────────────────────────────
      # Running in the same pod so the agent connects via localhost — no network hop.
      # The k8s-agent ServiceAccount provides both K8s RBAC and IRSA credentials.

      - name: kubectl-mcp
        image: __MCP_IMAGE__
        command: ["supergateway"]
        args:
        - "--stdio"
        - "mcp-server-kubernetes"
        - "--port"
        - "3001"
        - "--outputTransport"
        - "streamableHttp"
        - "--stateful"
        - "--healthEndpoint"
        - "/healthz"
        ports:
        - containerPort: 3001
          name: kubectl-mcp
        # Stateful mode keeps one persistent child per session — no concurrent spawning,
        # no OOM. The _drive() break-on-interrupt fix in main.py closes the initial
        # session cleanly so the resume stream_agent() gets a fresh session/child.
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 5

      - name: cloudwatch-mcp
        image: __MCP_IMAGE__
        command: ["supergateway"]
        args:
        - "--stdio"
        - "awslabs.cloudwatch-mcp-server"
        - "--port"
        - "3002"
        - "--outputTransport"
        - "streamableHttp"
        - "--stateful"
        - "--healthEndpoint"
        - "/healthz"
        ports:
        - containerPort: 3002
          name: cloudwatch-mcp
        env:
        - name: AWS_REGION
          value: "__AWS_REGION__"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 5

      volumes:
      - name: agent-memory
        emptyDir: {}
      - name: cluster-skill
        configMap:
          name: k8s-agent-cluster-skill

      priorityClassName: infrastructure

---
apiVersion: v1
kind: Service
metadata:
  name: k8s-agent
  namespace: k8s-agent
  # ClusterIP: /trigger has no authentication, so it is not exposed to the
  # internet. Alarms reach the agent through Slack; for a manual test use
  #   kubectl port-forward -n k8s-agent svc/k8s-agent 8080:8080
spec:
  type: ClusterIP
  selector:
    app: k8s-agent
  ports:
    - port: 8080
      targetPort: 8080
      name: http-trigger

# Cross-namespace access into workload namespaces is already granted by the cluster-wide
# ClusterRoleBinding above (apiGroups/resources/verbs all *). Per-namespace
# bindings would only add value if we tightened cluster scope; for now the
# cluster-admin binding is sufficient and avoids a hard dependency on the
# workload namespace existing at agent deploy time.
